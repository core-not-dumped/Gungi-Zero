name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv 는 v8 부터 `v10` 같은 이동 태그를 내지 않아 정확한 버전을 적는다.
      - uses: astral-sh/setup-uv@v10.4.0
      # 파이썬 버전은 .python-version 을 따른다. --locked 는 uv.lock 이 낡았으면 실패한다.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
