[project]
name = "gungi-zero"
version = "0.1.0"
description = "AlphaZero-style self-play reinforcement learning for Gungi"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.1",
    "optuna>=5.1.0",
    "pygame>=2.6",
    "torch>=2.15",
    "wandb>=0.31.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

# Flat layout: games/, engine/, ai/, eval/, ui/ are top-level packages in the
# repository root, not under src/. Nothing is installed, so no build backend.
[tool.uv]
package = false

# torch 는 플랫폼마다 받는 곳이 다르다. 리눅스(CI)는 수 GB 의 CUDA 휠을 받지 않게 CPU 판을,
# Windows(로컬)는 GPU 를 쓰는 CUDA 판을 받는다. 그 밖의 플랫폼은 PyPI 를 쓴다.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 처음부터 학습하거나 푸는 검증은 `from_scratch` 로 표시하고 기본 실행에서 뺀다 (몇십 분).
# `uv run pytest -m from_scratch` 로 돌린다.
addopts = "-q -m 'not from_scratch'"
markers = ["from_scratch: 처음부터 학습하거나 푸는 검증. 몇십 분이 걸려 로컬에서만 돌린다"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "RUF",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["games", "engine", "ai", "eval", "ui", "scripts", "tests"]
